<!-- Supabase Dashboard → Authentication → Emails → "Reset password"
     Asunto sugerido: Restablece tu contraseña de EmprendeHN -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h1 style="color: #0f3d5e; font-size: 22px; margin: 0 0 16px;">
    Emprende<span style="color: #ff7a3d;">HN</span>
  </h1>
  <h2 style="font-size: 18px; margin: 0 0 12px;">Restablece tu contraseña</h2>
  <p style="line-height: 1.5;">
    Recibimos una solicitud para cambiar la contraseña de tu cuenta. Haz clic en el botón para
    crear una nueva. El enlace vence en 1 hora.
  </p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="background: #0f3d5e; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block;">
      Crear nueva contraseña
    </a>
  </p>
  <p style="font-size: 13px; color: #555; line-height: 1.5;">
    Si no solicitaste este cambio, ignora este correo: tu contraseña seguirá siendo la misma.
  </p>
</div>
