<!-- Supabase Dashboard → Authentication → Emails → "Confirm signup"
     Asunto sugerido: Confirma tu cuenta en EmprendeHN -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h1 style="color: #0f3d5e; font-size: 22px; margin: 0 0 16px;">
    Emprende<span style="color: #ff7a3d;">HN</span>
  </h1>
  <h2 style="font-size: 18px; margin: 0 0 12px;">Confirma tu correo</h2>
  <p style="line-height: 1.5;">
    ¡Gracias por registrarte! Confirma tu correo para activar tu cuenta y publicar tu negocio
    en el directorio de emprendedores de Honduras.
  </p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="background: #ff7a3d; color: #1a1a1a; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block;">
      Confirmar mi cuenta
    </a>
  </p>
  <p style="font-size: 13px; color: #555; line-height: 1.5;">
    Si no creaste una cuenta en EmprendeHN, ignora este correo.
  </p>
</div>
